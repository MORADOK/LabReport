[theme]
# สีหลัก (ปุ่ม, แถบเลือก, กราฟ) เน้นโทน Medical Blue
primaryColor = "#0066cc"

# สีพื้นหลังหน้าเว็บ (สีเทาอ่อน สบายตา)
backgroundColor = "#f4f7f6"

# สีพื้นหลังของ Sidebar และ Card ต่างๆ (สีขาวล้วน ดูสะอาด)
secondaryBackgroundColor = "#ffffff"

# สีตัวอักษร
textColor = "#1e293b"

# ฟอนต์ (เรียบหรู ทันสมัย)
font = "sans serif"

[browser]
# ซ่อน error messages ที่ไม่จำเป็นใน console
gatherUsageStats = false
# กดปุ่ม Shift+Ctrl+E เพื่อดู error details หากต้องการ
serverPort = 8501

[server]
# เพิ่มความเสถียรของ WebSocket connection
enableCORS = false
enableXsrfProtection = true
# ปิด headless mode เพื่อลด warnings
headless = false

[logger]
# ลดระดับ logging เพื่อลด warnings
level = "error"